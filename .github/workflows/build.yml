name: Build APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java/com/vibe/englishtracker

          # Ищем файл с кодом. Если их несколько, берём тот, что менялся в репозитории последним.
          CODE_FILE=""
          BEST=0
          for f in $(grep -rl --exclude-dir=.git --exclude-dir=.github --exclude-dir=app --exclude="*.yml" --exclude="*.md" "EnglishTrackerRoot" .); do
            T=$(git log -1 --format=%ct -- "$f")
            T=${T:-0}
            if [ "$T" -ge "$BEST" ]; then
              BEST=$T
              CODE_FILE="$f"
            fi
          done
          if [ -z "$CODE_FILE" ]; then
            echo "Не найден файл с кодом: в нём должно быть слово EnglishTrackerRoot"
            exit 1
          fi
          echo "Код взят из файла: $CODE_FILE"
          cp "$CODE_FILE" app/src/main/java/com/vibe/englishtracker/MainActivity.kt

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "EnglishTracker"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.3.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.vibe.englishtracker"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.vibe.englishtracker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }

              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.11" }

              packaging {
                  resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" }
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.04.01")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="English"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Tracker-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
